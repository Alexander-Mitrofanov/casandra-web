# Include exactly once inside the operator-managed HTTPS server block.
location = /casandra/api/v1 {
    return 308 /casandra/api/v1/;
}

location ^~ /casandra/api/v1/ {
    # The API enforces 110,000,000 bytes. This includes only its fixed
    # middleware allowance above that application limit.
    client_max_body_size 110032768;
    client_body_buffer_size 128k;
    client_body_timeout 600s;
    client_body_temp_path /srv/casandra/nginx-client-body 1 2;
    send_timeout 120s;

    limit_conn_status 429;
    limit_conn casandra_client_connections 4;
    limit_conn casandra_global_connections 8;
    limit_conn casandra_client_uploads 1;
    limit_conn casandra_global_uploads 1;
    limit_req_status 429;
    limit_req zone=casandra_client_requests burst=15 nodelay;
    limit_req zone=casandra_global_requests burst=20 nodelay;
    limit_req zone=casandra_submissions burst=1 nodelay;

    limit_except GET POST DELETE OPTIONS {
        deny all;
    }

    access_log off;
    error_log /var/log/nginx/casandra_web_error.log crit;

    proxy_pass http://casandra_web_api;
    proxy_http_version 1.1;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    proxy_send_timeout 900s;

    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_protocol_addr;
    proxy_set_header X-Real-IP $proxy_protocol_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header Forwarded "";
    proxy_set_header Range "";
    proxy_set_header If-Range "";
    proxy_hide_header Server;
}
