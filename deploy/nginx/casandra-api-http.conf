# Install in /etc/nginx/conf.d/. These directives belong to the http context.
upstream casandra_web_api {
    server 127.0.0.1:8010;
    keepalive 4;
}

map $request_method $casandra_submission_key {
    default "";
    POST $binary_remote_addr;
}

limit_conn_zone $binary_remote_addr zone=casandra_client_connections:10m;
limit_conn_zone $server_name zone=casandra_global_connections:1m;
limit_req_zone $binary_remote_addr zone=casandra_client_requests:10m rate=5r/s;
limit_req_zone $server_name zone=casandra_global_requests:1m rate=15r/s;
limit_req_zone $casandra_submission_key zone=casandra_submissions:10m rate=4r/m;
