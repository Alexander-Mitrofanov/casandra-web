# Tailscale Funnel terminates TLS and connects only to this loopback
# PROXY-protocol-v2 listener. Plain loopback HTTP is rejected by Nginx.
server {
    listen 127.0.0.1:8082 proxy_protocol default_server;
    server_name _;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    real_ip_recursive off;

    server_tokens off;
    client_header_timeout 10s;
    keepalive_requests 100;
    keepalive_timeout 10s;
    reset_timedout_connection on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    access_log off;
    error_log /var/log/nginx/casandra_web_error.log crit;

    include /etc/nginx/snippets/casandra-api-location.conf;

    location / {
        return 404;
    }
}
