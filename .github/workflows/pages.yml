name: Publish CasAndra Web frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build static site
        working-directory: frontend
        env:
          CASANDRA_API_ORIGIN: ${{ vars.CASANDRA_API_ORIGIN }}
          CONFIGURED_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
        run: |
          set -euo pipefail
          if [[ -z "${CASANDRA_API_ORIGIN}" ]]; then
            echo "Repository variable CASANDRA_API_ORIGIN is required" >&2
            exit 1
          fi
          base_path="${CONFIGURED_BASE_PATH}"
          if [[ -z "${base_path}" ]]; then
            base_path="/${GITHUB_REPOSITORY#*/}/"
          fi
          VITE_API_BASE_URL="${CASANDRA_API_ORIGIN}" VITE_BASE_PATH="${base_path}" npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
