[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "casandra-web"
version = "0.1.0"
description = "Queue-backed web service for CasAndra and CRISPRidentify v2"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi==0.139.2",
  "pydantic==2.13.4",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
test = ["httpx2>=2.12", "pytest>=8", "pytest-asyncio>=1.4", "ruff>=0.15"]

[project.scripts]
casandra-web-api = "casandra_web.api:main"
casandra-web-worker = "casandra_web.worker:main"
casandra-web-cleanup = "casandra_web.cleanup:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
