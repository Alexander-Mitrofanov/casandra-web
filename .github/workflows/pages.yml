name: Publish CasAndra Web frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build static site
        working-directory: frontend
        env:
          CASANDRA_API_ORIGIN: ${{ vars.CASANDRA_API_ORIGIN }}
          CONFIGURED_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
        run: |
          set -euo pipefail
          if [[ -z "${CASANDRA_API_ORIGIN}" ]]; then
            echo "Repository variable CASANDRA_API_ORIGIN is required" >&2
            exit 1
          fi
          base_path="${CONFIGURED_BASE_PATH}"
          if [[ -z "${base_path}" ]]; then
            base_path="/${GITHUB_REPOSITORY#*/}/"
          fi
          VITE_API_BASE_URL="${CASANDRA_API_ORIGIN}" VITE_BASE_PATH="${base_path}" npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
