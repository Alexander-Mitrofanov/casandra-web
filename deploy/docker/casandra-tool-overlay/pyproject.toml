[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CasAndra"
version = "0.3.0.dev0"
description = "Offline CPU-only Cas gene detection and CRISPR-Cas cassette classification"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "CasAndra contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "biopython>=1.83",
  "joblib>=1.3",
  "numpy>=1.26",
  "pyhmmer>=0.11",
  "pyrodigal>=3.5",
  # The bundled Joblib estimator was serialized with this exact version.
  "scikit-learn==1.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
casandra = "casandra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
casandra = [
  "models/*.json",
  "models/protein/*",
  "models/cassette_architecture/*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
